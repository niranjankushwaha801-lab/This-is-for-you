<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hello Kashmita💖</title>
 <title>THIS IS FOR YOU💕</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    text-align: center;
    overflow: hidden;
  }

  body.pink {
    background: linear-gradient(135deg, #ffb6c1, #ffc0cb);
  }

  .card {
    background: rgba(255,255,255,0.22);
    padding: 28px;
    border-radius: 25px;
    width: 90%;
    max-width: 480px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
    z-index: 2;
  }

  p {
    font-size: 17px;
    line-height: 1.6;
  }

  button {
    margin: 12px;
    padding: 12px 28px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
  }

  .yes { background: #ff4d6d; color: white; }
  .no  { background: #6c757d; color: white; }

  .heart {
    position: fixed;
    bottom: -20px;
    font-size: 22px;
    animation: float 6s linear infinite;
    opacity: 0.8;
    z-index: 1;
  }

  @keyframes float {
    from { transform: translateY(0); }
    to { transform: translateY(-120vh); }
  }
</style>
</head>

<body>

<div class="card" id="card">
  <p>
    <strong>Hello Kashmita 😽💖</strong><br><br>
    Please give me just 2–3 minutes…<br>
    I sincerely want to say something that come straight from my heart 💌.
If any of my words feel uncomfortable to you,sorry for that🙏.
  </p>
  <button class="yes" onclick="nextScene()">Start 💖</button>
</div>

<script>
const card = document.getElementById("card");
let step = 0;
let yesCount = 0;

const scenes = [
  { 








    letter: "I don’t want perfection.I just want honesty laughter and shared dreams 💓",
    question: "Does this kind of connection feel meaningful to you? 🌸"
  },
  {
    letter: "You feel like peace to me — like calm after a long day 😌💗",
    question: "Do you feel comfortable being yourself around me?"
  },
  {
    letter: "I believe in supporting each other through ups and downs 🌈",
    question: "Do you believe mutual support makes bonds stronger?"
  },
  {
    letter: "i just admire you from around 6 to 7 years💞",
    question: "Do you have any idea about that?"
  },
  {
    letter: "No matter what, you are genuinely special and respected 💝",
    question: "Would you like to explore something sincere with me?"
  }
];

function nextScene() {
  if (step < scenes.length) {
    card.innerHTML = `
      <p>${scenes[step].letter}</p>
      <p><strong>${scenes[step].question}</strong></p>
      <button class="yes" onclick="yes()">YES 💖</button>
      <button class="no" onclick="no()">NO 🙈</button>
    `;
  } else {
    showFinal();
  }
}

function yes() {
  yesCount++;
  step++;
  nextScene();
}

function no() {
  card.innerHTML = `
    <p>Thank you for being honest 🤍</p>
    <p>Your feelings are respected, always 🌸</p>
    <button class="yes" onclick="step++; nextScene()">Continue 💭</button>
  `;
}

function showFinal() {
  if (yesCount === scenes.length) {
    document.body.classList.add("pink");
    startHearts();
    card.innerHTML = `
      <p>
        <strong>Dear Kashmita 🫶</strong><br><br>
        First of all, I’m truly sorry for disturbing you again ♾️.<br><br>

        Today I’m not here to propose you but to share something that genuinely means a lot to me ❤️.<br><br>

        I know I may never be able to have a relationship with you, yet I want you to know how deeply I admire you.
        I love you — not in possession, but in respect, care, and sincerity 💐.Sorry I Weren't able to stay admired for you for a long time.From the  last conversation in  class 8,I just went to others girls in the search of your love and presence but unfortunately I couldn't able to gain that and at the end , it ends as a looser ❣️.Maybe because of my own sillyness,I become like I was now .Sometimes i felt like In the search of Gold,I have lost the Diamond🙌.I knew you will never love me but i can,t carry my feelings any more and as it is our last year too. I may be not able to see you anymore but i'll always be there wherever you need me ❤️.
<br><br>

        From the day you came into my life (since Grade 2), everything started feeling lighter, happier, and more meaningful 😙.<br><br>

        Your smile calms my chaos, and your presence makes even ordinary moments special 🫶.Maybe in the future i would find someone but the feelings that i have for you would never change for sure. You will forever in my heart.I will forever remember your smile,laughter,behaviour,your eyes and your presence.Maybe it feels stupidity to you but it means a lot to me<br><br>

        You’re not just someone I like; you’re someone my heart chose quietly and sincerely 💓.Hope you'll forgive my mistakes or sillyness,if i have done.Sorry for these kind of stuffs .The main reason of this is to say virtuallly because i an't confess to you directly.Even though i have female friends,i am unable to stand and talk to with you.Still your presence makes my heart beat increases❤️🙌.<br><br>

        Stay safe always from this crueal worldand be focusd on your study too.I wish you happiness, success in your SEE exam and a future full of light 🙌❤️‍🩹🫶.<br><br>
         FROM ;-
        — Someone who has quietly cared for you for the past six years… ♾️
      </p>
      <p><strong>Thank you for reading this 💖</strong></p>
    `;
  } else {
    card.innerHTML = `
      <p>Thank you for your honesty 🤍</p>
      <p>I truly wish you happiness and peace 🌸</p>
    `;
  }
}

function startHearts() {
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (4 + Math.random() * 3) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 7000);
  }, 400);
}
</script>

</body>
                                      </html>
